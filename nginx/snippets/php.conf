# 404
try_files $fastcgi_script_name =404;

# default fastcgi_params
include fastcgi_params;

# fastcgi settings
fastcgi_index			index.php;
fastcgi_buffers			8 16k;
fastcgi_buffer_size		32k;

# fastcgi params
fastcgi_param DOCUMENT_ROOT		$realpath_root;
fastcgi_param SCRIPT_FILENAME	$realpath_root$fastcgi_script_name;

# Per-request correlation id. Always sourced from nginx's $request_id (a fresh
# 32-char hex value), never echoed from a client-supplied X-Request-ID header
# — that prevents log injection and keeps id authority local. PHP reads it via
# Hirale_Core_Helper_Request::getRequestId(). When the Go Edge Gateway lands at
# project step 7 it becomes the upstream issuer; this line is then removed.
fastcgi_param HTTP_X_REQUEST_ID	$request_id;
