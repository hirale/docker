# Observability stack — optional, not started by default.
# Usage: docker compose -f compose.yml -f compose.observability.yml up -d
#
# Services: loki, alloy, grafana, prometheus, exporters, glitchtip
# Requires: core services from compose.yml (mysql, redis, nginx)
# See docs/deploy/observability.md in the maho repo.

name: lnmp
services:
  loki:
    image: grafana/loki:${LOKI_VERSION}
    container_name: loki
    restart: unless-stopped
    command: -config.file=/etc/loki/config.yaml
    volumes:
      - ./loki/config.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    networks:
      - backend
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:3100/ready | grep -q 'ready'" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  alloy:
    image: grafana/alloy:${ALLOY_VERSION}
    container_name: alloy
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data
      - ${WEB_ROOT}:/var/www:ro
    networks:
      - backend
    depends_on:
      loki:
        condition: service_healthy

  glitchtip-postgres:
    image: postgres:${GLITCHTIP_POSTGRES_VERSION:-16-alpine}
    container_name: glitchtip-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=glitchtip
      - POSTGRES_PASSWORD=${GLITCHTIP_POSTGRES_PASSWORD}
      - POSTGRES_DB=glitchtip
    volumes:
      - glitchtip-postgres-data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U glitchtip" ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  x-glitchtip-env: &glitchtip-env
    DATABASE_URL: postgres://glitchtip:${GLITCHTIP_POSTGRES_PASSWORD}@glitchtip-postgres:5432/glitchtip
    REDIS_URL: redis://redis:6379/3
    SECRET_KEY: ${GLITCHTIP_SECRET_KEY}
    GLITCHTIP_DOMAIN: https://glitchtip.example.com
    DEFAULT_FROM_EMAIL: ${GLITCHTIP_DEFAULT_FROM_EMAIL:-noreply@myproject.example.com}
    EMAIL_URL: ${GLITCHTIP_EMAIL_URL:-smtp://mailpit:1025}
    CELERY_WORKER_AUTOSCALE: "1,3"

  glitchtip:
    image: glitchtip/glitchtip:${GLITCHTIP_VERSION}
    container_name: glitchtip
    restart: unless-stopped
    environment:
      <<: *glitchtip-env
      PORT: "8000"
      ENABLE_OPEN_USER_REGISTRATION: ${GLITCHTIP_ENABLE_OPEN_USER_REGISTRATION:-true}
      DEFAULT_ROLE: owner
    volumes:
      - glitchtip-uploads:/code/uploads
    networks:
      - backend
    depends_on:
      glitchtip-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/_health/').read().strip() == b'ok' else 1)" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  glitchtip-worker:
    image: glitchtip/glitchtip:${GLITCHTIP_VERSION}
    container_name: glitchtip-worker
    restart: unless-stopped
    command: ./bin/run-celery-with-beat.sh
    environment:
      <<: *glitchtip-env
    volumes:
      - glitchtip-uploads:/code/uploads
    networks:
      - backend
    depends_on:
      glitchtip-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:${PROMETHEUS_VERSION}
    container_name: prometheus
    restart: unless-stopped
    user: "65534:65534"   # nobody — Prometheus image runs as nobody by default
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - backend
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:9090/-/ready | grep -q 'Prometheus Server is Ready'" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  mysqld-exporter:
    image: prom/mysqld-exporter:${MYSQLD_EXPORTER_VERSION}
    container_name: mysqld-exporter
    restart: unless-stopped
    command:
      - --mysqld.address=mysql:3306
      - --mysqld.username=root
      - --collect.global_status
      - --collect.global_variables
      - --collect.info_schema.processlist
      - --collect.info_schema.innodb_metrics
    environment:
      - MYSQLD_EXPORTER_PASSWORD=${MYSQL_ROOT_PASSWORD}
    networks:
      - backend
    depends_on:
      mysql:
        condition: service_healthy

  redis-exporter:
    image: oliver006/redis_exporter:${REDIS_EXPORTER_VERSION}
    container_name: redis-exporter
    restart: unless-stopped
    environment:
      - REDIS_ADDR=redis://redis:6379
    networks:
      - backend
    depends_on:
      redis:
        condition: service_healthy

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:${NGINX_EXPORTER_VERSION}
    container_name: nginx-exporter
    restart: unless-stopped
    command:
      - --nginx.scrape-uri=http://nginx:8080/stub_status
    networks:
      - backend
    depends_on:
      nginx:
        condition: service_healthy

  grafana:
    image: grafana/grafana:${GRAFANA_VERSION}
    container_name: grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL:-https://grafana.example.com/}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - backend
    depends_on:
      loki:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:3000/api/health | grep -q '\"database\":\\s*\"ok\"'" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  backend:
    driver: bridge

volumes:
  loki-data:
  alloy-data:
  grafana-data:
  prometheus-data:
  glitchtip-postgres-data:
  glitchtip-uploads:
