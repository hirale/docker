# dockerd's default json-file driver never rotates; cap every container's log.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

services:
  php85-fpm:
    build:
      context: ./php-fpm
      args:
        PHP_VERSION: "8.5"
        MAILPIT_BINARY_VERSION: ${MAILPIT_BINARY_VERSION:-1.29.3}
        NODE_MAJOR: ${NODE_MAJOR:-24}
    container_name: php85-fpm
    user: "www-data"
    working_dir: /var/www
    volumes:
      - ${WEB_ROOT}:/var/www/
      # Mount only customised config so the image keeps its generated conf.d/*.ini
      - ${PHP_CONFIG}/php/php.ini:/usr/local/etc/php/php.ini
      - ${PHP_CONFIG}/php/conf.d/docker-php-ext-opcache.ini:/usr/local/etc/php/conf.d/docker-php-ext-opcache.ini
      - ${PHP_CONFIG}/php/conf.d/docker-php-ext-xdebug.ini:/usr/local/etc/php/conf.d/docker-php-ext-xdebug.ini
      - ${PHP_CONFIG}/logrotate.d:/usr/local/etc/logrotate.d
    restart: unless-stopped
    logging: *default-logging
    networks:
      - backend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t >/dev/null 2>&1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
