name: lnmp
services:
  nginx:
    image: nginx:${NGINX_VERSION}
    container_name: nginx
    working_dir: /var/www
    volumes:
      - ${WEB_ROOT}:/var/www
      - ${NGINX_CONFIG}:/etc/nginx
    restart: unless-stopped
    ports:
      - "443:443"
    networks:
      - backend
    depends_on:
      php-fpm:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "nginx -t -q" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Default PHP version (set PHP_VERSION in .env)
  php-fpm:
    build:
      context: ./php-fpm
      args:
        PHP_VERSION: ${PHP_VERSION}
        MAILPIT_BINARY_VERSION: ${MAILPIT_BINARY_VERSION}
        NODE_MAJOR: ${NODE_MAJOR}
    container_name: php-fpm
    user: "www-data"
    working_dir: /var/www/
    environment:
      # Optional Sentry/GlitchTip DSN for app-side error reporting.
      # Empty value = disabled; the app should skip init when unset.
      - BACKEND_GLITCHTIP_DSN=${BACKEND_GLITCHTIP_DSN}
    volumes:
      - ${WEB_ROOT}:/var/www/
      # Mount only customised config so the image keeps its generated conf.d/*.ini
      - ${PHP_CONFIG}/php/php.ini:/usr/local/etc/php/php.ini
      - ${PHP_CONFIG}/php/conf.d/docker-php-ext-opcache.ini:/usr/local/etc/php/conf.d/docker-php-ext-opcache.ini
      - ${PHP_CONFIG}/php/conf.d/docker-php-ext-xdebug.ini:/usr/local/etc/php/conf.d/docker-php-ext-xdebug.ini
      - ${PHP_CONFIG}/logrotate.d:/usr/local/etc/logrotate.d
    restart: unless-stopped
    ports:
      - "5173:5173"
    networks:
      - backend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "php-fpm -t >/dev/null 2>&1" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  mysql:
    image: mysql:${MYSQL_VERSION}
    container_name: mysql
    command: --max-connections=${MYSQL_MAX_CONNECTIONS}
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_ROOT_HOST=%
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - TZ=${MYSQL_TZ}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "--silent" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - backend

  mailpit:
    image: axllent/mailpit:${MAILPIT_VERSION_IMAGE}
    container_name: mailpit
    restart: unless-stopped
    networks:
      - backend
    healthcheck:
      test: [ "CMD-SHELL", "grep -qa mailpit /proc/1/cmdline" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  redis:
    image: redis:${REDIS_VERSION}
    container_name: redis
    restart: unless-stopped
    networks:
      - backend
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  ofelia:
    image: mcuadros/ofelia:${OFELIA_VERSION}
    container_name: ofelia
    restart: unless-stopped
    depends_on:
      php-fpm:
        condition: service_healthy
    volumes:
      - ${DOCKER_SOCKET}:/var/run/docker.sock:ro
      - ${OFELIA_CONFIG}:/etc/ofelia/config.ini
    networks:
      - backend

  # Certbot — on-demand SSL certificate management via DNS-01 (117+ providers).
  # Not started by default. Use: make ssl-issue DOMAIN=x EMAIL=y CRED=provider
  # Credentials files: certbot/credentials/<provider>.ini
  certbot:
    image: ghcr.io/alexzorin/certbot-dns-multi:latest
    container_name: certbot
    profiles:
      - certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/credentials:/credentials:ro
      - ./nginx/certs:/output/certs

networks:
  backend:
    driver: bridge

volumes:
  mysql-data:
