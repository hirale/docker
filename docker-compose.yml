name: lnmp
services:
  nginx:
    image: nginx:${NGINX_VERSION}
    container_name: nginx
    working_dir: /var/www/html
    volumes:
      - ${WEB_ROOT}:/var/www/html
      - ${NGINX_CONFIG}:/etc/nginx
    restart: unless-stopped
    ports:
      - "443:443"
    networks:
      - backend
    depends_on:
      php-fpm:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nginx -t -q"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Default PHP version (set PHP_VERSION in .env)
  php-fpm:
    build:
      context: ./php-fpm
      args:
        PHP_VERSION: ${PHP_VERSION:-8.4.8}
        MAILPIT_BINARY_VERSION: ${MAILPIT_BINARY_VERSION:-1.29.3}
    container_name: php-fpm
    volumes:
      - ${WEB_ROOT}:/var/www/html/
      - ${PHP_CONFIG}:/usr/local/etc
    restart: unless-stopped
    networks:
      - backend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t >/dev/null 2>&1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  mysql:
    image: mariadb:${MARIADB_VERSION}
    container_name: mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${MARIADB_ROOT_PASSWORD}
      - MYSQL_ROOT_HOST=%
      - MYSQL_DATABASE=${MARIADB_DATABASE}
      - MYSQL_USER=${MARIADB_USER}
      - MYSQL_PASSWORD=${MARIADB_PASSWORD}
      - TZ=${MARIADB_TZ}
    ports:
      - "3306:3306"
    volumes:
      - ${MARIADB_DATA_DIR}:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - backend

  mailpit:
    image: axllent/mailpit:${MAILPIT_VERSION_IMAGE}
    container_name: mailpit
    restart: unless-stopped
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "grep -qa mailpit /proc/1/cmdline"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  redis:
    image: redis:${REDIS_VERSION}
    container_name: redis
    restart: unless-stopped
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  ofelia:
    image: mcuadros/ofelia:${OFELIA_VERSION}
    container_name: ofelia
    restart: unless-stopped
    depends_on:
      php-fpm:
        condition: service_healthy
    volumes:
      - ${DOCKER_SOCKET}:/var/run/docker.sock:ro
      - ${OFELIA_CONFIG}:/etc/ofelia/config.ini
    networks:
      - backend

networks:
  backend:
    driver: bridge
